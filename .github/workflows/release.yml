name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const { version } = require('./package.json');
          if (process.env.REF_TYPE === 'tag' && process.env.TAG_NAME !== `v${version}`) {
            throw new Error(`Release tag must match package.json version: v${version}`);
          }
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fakeroot rpm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Install Electron after the extraction patch
        run: |
          node node_modules/electron/install.js
          node -e "require('node:fs').accessSync(require('electron'))"

      - name: Check code
        run: |
          pnpm run lint
          pnpm exec tsc --noEmit
          pnpm test

      - name: Generate macOS icon
        if: runner.os == 'macOS'
        run: |
          iconset="$RUNNER_TEMP/finance-viewer.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/icons/icon.png --out "$iconset/icon_${size}x${size}.png"
            double=$((size * 2))
            sips -z "$double" "$double" assets/icons/icon.png --out "$iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$iconset" -o assets/icons/icon.icns

      - name: Build installers
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: pnpm exec electron-forge make --arch "$BUILD_ARCH"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finance-viewer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            out/make/**/*.exe
            out/make/**/*.msi
            out/make/**/*.nupkg
            out/make/**/RELEASES
            out/make/**/*.zip
            out/make/**/*.dmg
            out/make/**/*.deb
            out/make/**/*.rpm
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: finance-viewer-*
          path: release-artifacts

      - name: Publish installers to the tag release
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const repo = context.repo;
            const tag = process.env.TAG_NAME;
            const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (tag !== `v${version}`) throw new Error('Tag does not match package.json version');

            const { data: ref } = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
            let object = ref.object;
            while (object.type === 'tag') {
              const { data } = await github.rest.git.getTag({ ...repo, tag_sha: object.sha });
              object = data.object;
            }
            if (object.type !== 'commit' || object.sha !== context.sha) {
              throw new Error('Tag no longer points to the commit used for this build');
            }

            function collect(directory) {
              return fs.readdirSync(directory, { withFileTypes: true }).flatMap(entry => {
                const file = path.join(directory, entry.name);
                return entry.isDirectory() ? collect(file) : [file];
              });
            }
            const files = collect('release-artifacts');
            const names = files.map(file => path.basename(file));
            if (new Set(names).size !== names.length) throw new Error('Duplicate release asset names');
            const required = [
              ['windows-x64', /\.exe$/],
              ['windows-x64', /\.nupkg$/],
              ['windows-x64', /^RELEASES$/],
              ['macos-x64', /\.zip$/],
              ['macos-x64', /\.dmg$/],
              ['macos-arm64', /\.zip$/],
              ['macos-arm64', /\.dmg$/],
              ['linux-x64', /\.deb$/],
              ['linux-x64', /\.rpm$/],
            ];
            const installers = new Map();
            for (const [platform, extension] of required) {
              const directory = path.join('release-artifacts', `finance-viewer-${platform}`) + path.sep;
              const matched = files.filter(file => file.startsWith(directory) && extension.test(path.basename(file)));
              if (matched.length === 0) throw new Error(`Missing installer for ${platform}: ${extension}`);
              installers.set(platform, [...(installers.get(platform) || []), ...matched.map(file => path.basename(file))]);
            }

            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release && release.immutable) throw new Error('Release is immutable; publish a new version instead');

            let previousTag = null;
            for await (const page of github.paginate.iterator(github.rest.repos.listReleases, { ...repo, per_page: 100 })) {
              if (!previousTag) {
                // The last published release anchors the changelog.
                const previous = page.data.find(item => !item.draft && item.tag_name !== tag);
                if (previous) previousTag = previous.tag_name;
              }
              if (!release) {
                // The tag endpoint excludes drafts left behind by an interrupted upload.
                release = page.data.find(item => item.draft && item.tag_name === tag) ?? null;
              }
              if (previousTag && release) break;
            }

            const groups = new Map([
              ['feat', '新功能'],
              ['fix', '问题修复'],
              ['perf', '性能优化'],
              ['refactor', '重构'],
              ['docs', '文档'],
              ['test', '测试'],
            ]);
            const platformLabels = {
              'windows-x64': 'Windows x64',
              'macos-x64': 'macOS x64 (Intel)',
              'macos-arm64': 'macOS arm64 (Apple Silicon)',
              'linux-x64': 'Linux x64',
            };
            const sections = [];
            if (previousTag) {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                ...repo,
                basehead: `${previousTag}...${tag}`,
              });
              const entries = new Map();
              for (const commit of comparison.commits) {
                const subject = commit.commit.message.split('\n')[0].trim();
                if (subject.startsWith('Merge ')) continue;
                const parsed = subject.match(/^([a-z]+)(\([^)]*\))?!?:\s*(.+)$/i);
                const title = groups.get(parsed ? parsed[1].toLowerCase() : '') || '其他变更';
                const text = parsed ? parsed[3] : subject;
                entries.set(title, [...(entries.get(title) || []), `- ${text} ([${commit.sha.slice(0, 7)}](${commit.html_url}))`]);
              }
              sections.push('## 更新内容');
              for (const title of [...groups.values(), '其他变更']) {
                const items = entries.get(title);
                if (items) sections.push(`### ${title}\n${items.join('\n')}`);
              }
              if (entries.size === 0) sections.push('本次发布无新增提交。');
              sections.push(`**完整变更对比**: ${comparison.html_url}`);
            } else {
              sections.push('## 更新内容\n首个版本发布。');
            }
            sections.push('## 安装包');
            for (const [platform, artifacts] of installers) {
              sections.push(`- **${platformLabels[platform] || platform}**: ${artifacts.map(name => `\`${name}\``).join(', ')}`);
            }
            const body = sections.join('\n\n');

            const prerelease = version.includes('-');
            if (!release) {
              ({ data: release } = await github.rest.repos.createRelease({
                ...repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: tag,
                body,
                draft: true,
                prerelease,
              }));
            }
            execFileSync('gh', ['release', 'upload', tag, ...files, '--clobber'], { stdio: 'inherit' });
            await github.rest.repos.updateRelease({
              ...repo,
              release_id: release.id,
              body,
              draft: false,
              prerelease,
            });
            core.info(`Published ${files.length} assets to ${tag}`);
